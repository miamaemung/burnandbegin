const PICKS_KEY = "maihuarak-picks";

  try {
    const p = JSON.parse(localStorage.getItem(PICKS_KEY) || "null");

  } catch (e) {}

(function readTag() {
  const q = new URLSearchParams(location.search);

    if (!picks.order.includes(n)) picks.order.push(n);            // tapping the same object twice keeps its first place

const DOT_ORDER = [2, 4, 3, 5, 1];   // by slot: Photoframe (white), Doll/bear (mauve), Sweater (wine), Musicbox (purple), Flower (green)

const nextToPlay = (skip = -1) => playList().find(k => k !== skip && !picks.played.includes(k));

const askedFor = parseInt(new URLSearchParams(location.search).get("play"), 10) - 1;

let maskDirty = true, lastCount = 0;

const GLSL_NOISE = `
  float hash(vec2 p){ vec3 q = fract(p.xyx * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 4; i++){ v += a * noise(p); p *= 2.03; a *= .5; } return v; }
  // 0 = still under ash, 1 = wiped clean; the edge is ragged and grainy like smeared soot.
  // once the bouquet has been swiped, the clearing spreads out from that spot by itself (uFinish 0 to 1)
  float spreadAt(vec2 px){
    float d = distance(px, uOrigin) + (fbm(px * .006 + 11.) - .5) * 260.;
    return uFinish > 0. ? clamp((uFinish * uReach - d) / 300., 0., 1.) : 0.;   // nothing burns before a burn has started
  }
  // where a swipe has brushed off the top layer of ash (the burn not counted)
  float wipedAt(vec2 px, float m, float grain){
    return smoothstep(.22, .62, m + (fbm(px * .045) - .5) * .42 + (grain - .5) * .22);
  }
  float cleanAt(vec2 px, float m, float grain){
    return smoothstep(.22, .62, m + spreadAt(px) * 1.3 + (fbm(px * .045) - .5) * .42 + (grain - .5) * .22);
  }
  // how far the self-clearing has burnt through here: the bouquet goes exactly where the dark ash goes
  float goneAt(vec2 px, float grain){
    float sp = spreadAt(px);
    return smoothstep(.22, .62, sp * 1.3 + (fbm(px * .045) - .5) * .42 + (grain - .5) * .22) * min(1., sp * 8.);
  }`;

if (agl) {
  const sh = (type, src) => {
    const s = agl.createShader(type); agl.shaderSource(s, src); agl.compileShader(s);
    if (!agl.getShaderParameter(s, agl.COMPILE_STATUS)) console.warn("landing shader:", agl.getShaderInfoLog(s));
    return s;
  };
  const program = (vs, fs, attrs) => {
    const p = agl.createProgram();
    agl.attachShader(p, sh(agl.VERTEX_SHADER, vs));
    agl.attachShader(p, sh(agl.FRAGMENT_SHADER, fs));
    attrs.forEach((a, i) => agl.bindAttribLocation(p, i, a));
    agl.linkProgram(p);
    return agl.getProgramParameter(p, agl.LINK_STATUS) ? p : null;
  };

  // the ground: dark grainy ash, and beneath it white paper with a soft grey print of the bouquet
  bgP = program("attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }", `
    precision highp float;
    uniform sampler2D uMask, uPrint, uWords, uGlow, uDetail;
    uniform vec3 uSpin;         // the float's tilt (radians) and the point it turns about (px)
    uniform vec2 uRes;            // css px
    uniform vec4 uBox;            // where the print sits: x, y (from the top), w, h in css px
    uniform float uTime, uFinish, uDpr;
    uniform vec2 uOrigin;
    uniform float uReach;
    uniform float uStage;       // 1 = the dark ash, 2 = the grey layer
    uniform float uForm;        // how fully the flakes have gathered into the silhouette (0 to 1): its coloured haze fades in with them
    uniform float uGreen;       // the green glow fading in as the page opens (0 to 1)
    ${GLSL_NOISE}
    void main(){
      vec2 px = gl_FragCoord.xy / uDpr;                     // css px, from the bottom
      vec2 uv = px / uRes;
      // film grain in soft-edged clumps, shimmering slowly: each frame of grain fades into the next
      float gt = uTime * 12. * ${BG_SPEED.toFixed(3)}, gf = floor(gt), gk = smoothstep(0., 1., gt - gf);
      vec2 gp = px / (1.1 * ${BG_SIZE.toFixed(2)});
      vec2 g0 = gp + mod(gf, 61.) * vec2(17., 31.), g1 = gp + mod(gf + 1., 61.) * vec2(17., 31.);
      float grain = mix(mix(hash(floor(g0)), noise(g0), .7), mix(hash(floor(g1)), noise(g1), .7), gk);   // film grain, shimmering
      grain = clamp(.5 + (grain - .5) / sqrt(gk * gk + (1. - gk) * (1. - gk)), 0., 1.);   // keep its contrast steady while one frame fades into the next (no pulsing)
      float maskV = texture2D(uMask, uv).r;
      float clean = cleanAt(px, maskV, grain);
      float wiped = wipedAt(px, maskV, grain);

      // ash: near-black, mottled, thick with grain
      float mott = fbm(px * (.006 / ${BG_SIZE.toFixed(2)}) + 3.1);
      vec3 ash = vec3(.03 + .07 * mott + .13 * grain * grain);
      // slow drifting mist over everything
      vec2 fp = px / ${BG_SIZE.toFixed(2)};
      float ft = uTime * ${BG_SPEED.toFixed(3)};
      float fog = fbm(fp * .0024 + vec2(ft * .018, -ft * .011)) * fbm(fp * .006 - vec2(ft * .01, 0.) + 7.);

      // paper: white, a little uneven, darker toward the corners, still grainy
      vec2 pv = (vec2(px.x, uRes.y - px.y) - uBox.xy) / uBox.zw;
      float ink = all(greaterThan(pv, vec2(0.))) && all(lessThan(pv, vec2(1.))) ? 1.15 * texture2D(uPrint, vec2(pv.x, 1. - pv.y)).r : 0.;
      float inkS = ink;                             // the bouquet's own shape, before anything burns
      float gA = goneAt(px, grain);                 // the burn under way now
      bool two = uStage > 1.5;
      float gone = two ? 1. : gA;                   // the first burn (done, once on the grey layer)
      float gone2 = two ? gA : 0.;                  // the second burn, through the grey
      float wiped2 = two ? wiped : 0.;              // swipes on the grey layer
      wiped = two ? 0. : wiped;
      // once burnt, only a faint, softly spread ghost of the bouquet is left on the paper
      float ghost = 0., halo = 0.;
      if (all(greaterThan(pv, vec2(-.25))) && all(lessThan(pv, vec2(1.25)))) {   // only near the bouquet
        vec2 c = vec2(pv.x, 1. - pv.y);
        for (int k = 0; k < 8; k++) {
          float a = float(k) * .785 + .4;
          float near = texture2D(uPrint, c + vec2(cos(a), sin(a)) * vec2(.08, .05)).r;
          float far = texture2D(uPrint, c + vec2(cos(a + .39), sin(a + .39)) * vec2(.16, .1)).r;
          ghost += near + far; halo += far;
        }
        ghost *= 1.15 / 16.; halo *= 1.15 / 8.;
      }
      float pale = smoothstep(.08, .95, ink) * gone;   // after the burn the bouquet stays as a pale shape with a firm edge (no glow around it)
      ink *= 1. - gone;
      // the ground on every layer: a plain white screen (only the faintest grain)
      vec3 white = vec3(.975 + (grain - .5) * .02);
      // ...with grey ash gathered in its corners, ragged and grainy, thinning toward the middle
      vec2 cq = abs(uv - .5) * 2.;                                       // 0 at the centre, 1 at the edges
      float corner = length(cq) / 1.414;                                 // 1 only in the very corners
      corner += (fbm(px * (.006 / ${ASH_SIZE.toFixed(2)}) + 61.) - .5) * .32 + (fbm(px * (.03 / ${ASH_SIZE.toFixed(2)}) + 7.) - .5) * .1;
      // how thickly ash lies over the white: heaviest on the first layer, less on the second, only the corners on the third
      float cover = mix(mix(${ASH_LAYER1.toFixed(2)}, ${ASH_LAYER2.toFixed(2)}, gone), 0., gone2);
      corner += cover * .55;                                             // the corner ash creeps further in
      float soot = smoothstep(.6 - .3 * cover, 1.02, corner) * mix(${CORNER_ASH.toFixed(2)}, .95, cover);
      float fleck = step(.86, hash(floor(px / (2. * ${ASH_SIZE.toFixed(2)})) + 5.)) * smoothstep(.5, .9, corner);   // loose specks just inside it
      vec3 cornerAsh = vec3(.5 + .16 * fbm(px * (.02 / ${ASH_SIZE.toFixed(2)}) + 3.) + .16 * (grain - .5));
      cornerAsh = mix(cornerAsh, vec3(.7 + .14 * fbm(px * (.02 / ${ASH_SIZE.toFixed(2)}) + 3.) + .14 * (grain - .5)), cover * .7);   // thick ash stays pale, never dark
      white = mix(white, cornerAsh, soot);
      white = mix(white, vec3(.6), fleck * .35 * ${CORNER_ASH.toFixed(2)});
      // ...and a pale, mottled layer of ash dusted over the whole page (greyish white, never black)
      float drift = fbm(px * (.0035 / ${ASH_SIZE.toFixed(2)}) + 80.) * .65 + fbm(px * (.018 / ${ASH_SIZE.toFixed(2)}) + 12.) * .35;
      float dust = cover * clamp(.3 + .75 * drift + (grain - .5) * .25, 0., 1.);
      vec3 paleAsh = vec3(.79 + .12 * fbm(px * (.01 / ${ASH_SIZE.toFixed(2)}) + 44.) + .12 * (grain - .5));
      white = mix(white, paleAsh, dust * .85);
      white = mix(white, vec3(.66), step(.9, hash(floor(px / (2. * ${ASH_SIZE.toFixed(2)})) + 31.)) * cover * .3);   // loose specks in it
      ash = white;                                  // the first layer is the same white
      // the second phase: the same white too
      float gm = fbm(px * (.006 / ${BG_SIZE.toFixed(2)}) + 9.3);
      float paper = .4 + .1 * gm + .16 * grain * grain;
      paper -= .1 * smoothstep(.45, 1.25, length((uv - .5) * vec2(uRes.x / uRes.y, 1.)) * 1.3);
      vec3 print = white;
      print = mix(print, vec3(${FLAKE_GREEN.map(v => (v / 255).toFixed(3)).join(', ')}) * ${GREEN2_DIM.toFixed(2)}, pale * .5 * ${BACKDROP2.toFixed(2)});   // the silhouette's fill: the first layer's green, dimmed

      // a grey smear of soot left along the edge of what's been wiped
      float rim = clean * (1. - clean) * 4.;
      // a swipe only brushes off the top layer: beneath lies a thinner, paler veil of ash with glimpses of the paper through it
      float grain2 = hash(floor(px / (1.4 * ${BG_SIZE.toFixed(2)})) + 77.);
      float mott2 = fbm(px * .011 + 40.);
      vec3 veilAsh = vec3(.07 + .11 * mott2 + .12 * grain2 * grain2) + .08 * fog;
      float veilA = clamp(${VEIL.toFixed(2)} * (1. + .75 * (fbm(px * .009 + 20.) - .5) + .2 * (grain2 - .5)), 0., 1.);   // thinner in patches
      vec3 under = mix(print, veilAsh, veilA);
      vec3 col = mix(mix(ash, under, wiped), print, gone);     // the burn takes both layers away
      rim = wiped * (1. - wiped) * 4. * (1. - gone);
      col = mix(col, vec3(.3 + .1 * grain), rim * .28);

      col = mix(mix(col, white, wiped2), white, gone2);
      col = mix(col, vec3(.52 + .1 * grain), wiped2 * (1. - wiped2) * 4. * (1. - gone2) * .25);

      // the word: plain letters that appear where the first burn passes
      // each word floats on its own slow drift, like the silhouette
      float wid = floor(texture2D(uWords, uv).g * 255. / 40. + .5);
      float ww = 6.2832 / ${FLOAT_TIME.toFixed(2)};
      vec2 wf = wid > .5 ? vec2(${(FLOAT * .5).toFixed(2)} * sin(uTime * ww * .7 + wid * 2.1) + ${(FLOAT * .15).toFixed(2)} * sin(uTime * ww * 1.6 + wid),
                                ${(FLOAT * .7).toFixed(2)} * sin(uTime * ww * (.9 + .08 * wid) + wid * 1.7)) : vec2(0.);
      float letters = texture2D(uWords, (px - wf) / uRes).r;   // clean, solid letters
      vec3 ashLeft = vec3(.2);
      col = mix(col, ashLeft, letters * gone * (1. - gone2) * ${WORD_DARK.toFixed(2)});

      // the self-clearing burns: charred ash ahead of a flickering ember line, a brown scorch left behind on the paper
      float sp = spreadAt(px);
      float edge = gA * (1. - gA) * 4.;
      float flick = .65 + .7 * noise(px * .07 + vec2(0., -uTime * 6.)) * noise(px * .021 + uTime * 1.3);
      float ember = pow(edge, 1.6) * flick;
      float scorch = gA * (1. - smoothstep(.45, 1., sp));
      float charred = (1. - gA) * smoothstep(0., .2, sp);
      col *= 1. - .45 * charred * ${FIRE.toFixed(2)};
      col = mix(col, vec3(.42, .27, .15) * (.8 + .4 * grain), scorch * .55 * ${FIRE.toFixed(2)});
      col = mix(col, vec3(1., .42, .1), clamp(ember * .95, 0., 1.) * ${FIRE.toFixed(2)});
      col += vec3(1., .78, .45) * pow(edge, 6.) * flick * .55 * ${FIRE.toFixed(2)};       // the hot core of the line
      // what is left of the bouquet glows a faint green, breathing slowly
      float breath = .85 + .15 * sin(uTime * 1.2);
      float aura = smoothstep(.0, .5, halo * .5 + ghost * .7) * (1. - .6 * smoothstep(.35, .9, ghost));   // hugs the shape, fading outward; dimmer at its heart
      col += vec3(${FLAKE_GREEN.map(v => (v / 255).toFixed(3)).join(', ')}) * aura * gone * (1. - .45 * max(wiped2, gone2)) * ${GREEN2.toFixed(2)} * ${BACKDROP2.toFixed(2)} * uGreen * breath;   // the same sage glow on the grey layer
      // on the dark layer, a soft sage-green glow (the flakes' own colour) around the bouquet
      col += vec3(${FLAKE_GREEN.map(v => (v / 255).toFixed(3)).join(', ')}) * aura * (1. - gone) * ${GLOW1.toFixed(2)} * uGreen * breath;
      // a soft halo in the silhouette's own colours, fading out around it (on the dark and the grey layers)
      vec4 gw = all(greaterThan(pv, vec2(0.))) && all(lessThan(pv, vec2(1.))) ? texture2D(uGlow, vec2(pv.x, 1. - pv.y)) : vec4(0.);
      gw.a *= smoothstep(0., .12, min(min(pv.x, 1. - pv.x), min(pv.y, 1. - pv.y)));   // fade out before the edges of its box, so no straight edge ever shows
      col = mix(col, gw.rgb, clamp(pow(gw.a, .6) * ${HALO_GLOW.toFixed(2)} * uForm * mix(1. - gone, (1. - gone2) * .6 * ${BACKDROP2.toFixed(2)}, gone) * (.94 + .06 * sin(uTime * 1.2)), 0., 1.));   // tinted, on the white
      // the picture itself, faintly, beneath the flakes: its chains, flower and bindings show through the gaps (first layer only), tilting with the float
      vec2 sq = vec2(px.x, uRes.y - px.y) - uSpin.yz;
      float sc = cos(uSpin.x), ss = sin(uSpin.x);
      vec2 dv = (uSpin.yz + vec2(sq.x * sc + sq.y * ss, -sq.x * ss + sq.y * sc) - uBox.xy) / uBox.zw;
      vec4 dt = all(greaterThan(dv, vec2(0.))) && all(lessThan(dv, vec2(1.))) ? texture2D(uDetail, vec2(dv.x, 1. - dv.y)) : vec4(0.);
      col = mix(col, dt.rgb, dt.a * ${DETAIL.toFixed(2)} * (1. - gone) * uGreen);
      gl_FragColor = vec4(col, 1.);
    }`, ["a"]);

  // the particles: ash flakes that gather into the bouquet; pale on the dark ash, soot-dark on the white paper
  ptP = program(`
    attribute vec4 aDyn;       // x, y in css px, opacity, size (small while flying in, 1 once in place)
    attribute vec3 aStat;      // grey tone, size in css px, a random seed
    attribute vec3 aCol;       // the picture's colour where the flake sits
    varying vec3 vCol;
    uniform vec2 uRes;
    uniform float uScale;
    varying float vTone, vAlpha, vSeed, vSize, vPuff;
    uniform float uStage, uFinish;
    void main(){
      gl_Position = vec4(aDyn.x / uRes.x * 2. - 1., 1. - aDyn.y / uRes.y * 2., 0., 1.);
      // about a third of the flakes are loose puffs of mist; the rest are soft dots
      vPuff = step(fract(aStat.z * 13.7), .32);
      float compact = uStage > 1.5 ? 1. : mix(${(COMPACT * FLAKE_SIZE).toFixed(2)}, 1., uFinish);
      gl_PointSize = vSize = max(1., aStat.y * uScale * mix(2.2, 5., vPuff) * compact * aDyn.w * ${(PARTICLE_SCALE * (OBJ.flakeSize ?? 1)).toFixed(3)});
      vTone = aStat.x; vAlpha = aDyn.z; vSeed = aStat.z; vCol = aCol;
    }`, `
    precision highp float;
    uniform sampler2D uMask;
    uniform vec2 uRes;
    uniform float uFinish, uDpr, uTime;
    uniform vec2 uOrigin;
    uniform float uReach;
    uniform float uStage;       // 1 = the dark ash, 2 = the grey layer
    uniform float uGreen;       // the green glow fading in as the page opens (0 to 1)
    varying vec3 vCol;
    varying float vTone, vAlpha, vSeed, vSize, vPuff;
    ${GLSL_NOISE}
    void main(){
      vec2 q = gl_PointCoord - .5;
      float a = vSeed * 6.283, c = cos(a), s = sin(a);
      q = vec2(c * q.x - s * q.y, (s * q.x + c * q.y) * (1.1 + .5 * fract(vSeed * 7.31)));
      float r = length(q) * 2. + .12 * sin(atan(q.y, q.x) * 3. + vSeed * 40.);
      // somewhere between fog and a dot: a small grainy core inside a soft haze
      float haze = exp(-r * r * 3.2) * (1. - smoothstep(.85, 1., r));
      float core = 1. - smoothstep(.12, .42, r);
      float shape = mix(core * .32 + haze * .55, haze * .3, vPuff);
      shape = mix(1., shape, smoothstep(2., 5., vSize));
      vec2 px = gl_FragCoord.xy / uDpr;
      float clean = cleanAt(px, texture2D(uMask, px / uRes).r, fract(vSeed * 91.7));
      float mk = texture2D(uMask, px / uRes).r, gs = fract(vSeed * 91.7);
      bool two = uStage > 1.5;
      float gA = goneAt(px, gs);
      float g = two ? 1. : gA, g2 = two ? gA : 0.;          // first burn, second burn
      float w2 = two ? wipedAt(px, mk, gs) : 0.;          // swiped on the grey layer
      float onPaper = two ? 1. : max(wipedAt(px, mk, gs) * (1. - ${VEIL.toFixed(2)}), gA);
      float tone = mix(.3 + .62 * vTone, .1 + .42 * vTone, onPaper);
      // caught by the burning edge: the flake glows like an ember, then is gone with the dark ash
      // the first layer, in the manner of a soft-focus photograph: smooth, solid blobs that merge into one compact shape
      float blob = exp(-r * r * 2.4) * (1. - smoothstep(.9, 1., r));
      shape = mix(shape, blob * ${GREEN_ALPHA.toFixed(2)}, (1. - g));   // see-through: the dark shows through the green
      shape = mix(shape, haze * .6, smoothstep(.5, 1., g) * .5);   // after the burn: softer, but keeping some of its grain
      float gl = two ? g2 : g;
      float lit = smoothstep(0., .3, gl) * (1. - smoothstep(.55, 1., gl)) * ${FIRE.toFixed(2)};
      vec3 colr = vec3(tone);
      colr = mix(colr, vCol, (1. - g) * (1. - onPaper));   // on the dark: each flake in the picture's own colour   // one colour on the dark: sage green, fading in as the page opens
      colr = mix(colr, vec3(${FLAKE_GREEN.map(v => (v / 255).toFixed(3)).join(', ')}) * ${GREEN2_DIM.toFixed(2)} * mix(.9 + .2 * vTone, .35 + 1.2 * vTone, ${FORM2.toFixed(2)}), smoothstep(.6, 1., g));   // ...shaded by the picture, so it keeps its form   // on the grey the leftover flakes are the same green, dimmed
      colr = mix(colr, vec3(.42, .46, .44), max(w2 * .85, smoothstep(.5, 1., g2)));   // on the white third layer: soft grey
      colr = mix(colr, vec3(1., .5 + .25 * fract(vSeed * 17.3), .15) * 1.25, lit);     // caught by a burning edge
      float m = shape * vAlpha * mix(.95, .55, two ? 1. : clean) *   // (on the grey layer, held where the first burn left it: no jump)
        mix(1., ${(KEEP * (OBJ.fade2 ?? FADE2)).toFixed(2)}, smoothstep(.5, 1., g)) * (1. - smoothstep(.5, 1., g2)) * (1. + .6 * lit);   // the first burn leaves a fainter silhouette; the second takes it all
      gl_FragColor = vec4(colr * m, m);
    }`, ["aDyn", "aStat", "aCol"]);

  if (!bgP || !ptP) { console.warn("landing shaders failed to build"); agl = null; }
  else {
    for (const [p, names] of [[bgP, ["uMask", "uPrint", "uWords", "uGlow", "uDetail", "uSpin", "uRes", "uBox", "uTime", "uFinish", "uDpr", "uOrigin", "uReach", "uStage", "uGreen", "uForm"]],
                              [ptP, ["uMask", "uRes", "uScale", "uFinish", "uDpr", "uTime", "uOrigin", "uReach", "uStage", "uGreen"]]]) {
      U[p === bgP ? "bg" : "pt"] = Object.fromEntries(names.map(n => [n, agl.getUniformLocation(p, n)]));
    }
    quadBuf = agl.createBuffer();
    agl.bindBuffer(agl.ARRAY_BUFFER, quadBuf);
    agl.bufferData(agl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), agl.STATIC_DRAW);
    dynBuf = agl.createBuffer();
    statBuf = agl.createBuffer();
    colBuf = agl.createBuffer();
    const texture = unit => {
      const t = agl.createTexture();
      agl.activeTexture(agl.TEXTURE0 + unit);
      agl.bindTexture(agl.TEXTURE_2D, t);
      for (const [k, v] of [[agl.TEXTURE_MIN_FILTER, agl.LINEAR], [agl.TEXTURE_MAG_FILTER, agl.LINEAR],
                            [agl.TEXTURE_WRAP_S, agl.CLAMP_TO_EDGE], [agl.TEXTURE_WRAP_T, agl.CLAMP_TO_EDGE]]) agl.texParameteri(agl.TEXTURE_2D, k, v);
      return t;
    };
    maskTex = texture(0);
    printTex = texture(1);
    wordsTex = texture(2);
    glowTex = texture(3);
    detailTex = texture(4);
    agl.pixelStorei(agl.UNPACK_FLIP_Y_WEBGL, true);
    agl.blendFunc(agl.ONE, agl.ONE_MINUS_SRC_ALPHA);
  }
}
if (!agl) land.style.display = "none";

function loadPicture() {
  return new Promise(done => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext("2d").drawImage(img, 0, 0);
      done(c);
    };
    img.onerror = () => { console.warn("silhouette image failed to load"); done(null); };
    img.src = OBJ.image;
  });
}

// where the bouquet sits on screen
function pictureBox() {
  const phone = innerHeight > innerWidth * 1.15;          // an upright phone: use more of the narrow width
  const k = Math.min(innerWidth * (phone ? .86 : .8) / picture.width, Math.min(innerHeight * (phone ? .62 : .76), 780) / picture.height);
  const w = picture.width * k * (OBJ.size ?? 1), h = picture.height * k * (OBJ.size ?? 1);
  return { x: (innerWidth - w) / 2, y: (innerHeight - h) / 2, w, h };
}
// the soft print reaches past the bouquet's outline, like light bleeding round an object on photo paper
const PL = .35 + .3 * HALO, PT = .18 + .1 * HALO;     // how far the print reaches past the bouquet, as a share of its width / height
const printBox = b => ({ x: b.x - b.w * PL, y: b.y - b.h * PT, w: b.w * (1 + 2 * PL), h: b.h * (1 + 2 * PT) });

// The print: a heavily blurred grey shadow of the bouquet (darker where the bouquet is darker).
// The glow: the silhouette in its own colours, blurred far past its outline (like light bleeding from a coloured lamp)
function makeGlow() {
  const pw = 160, ph = Math.round(pw * (1 + 2 * PT) / (1 + 2 * PL) * picture.height / picture.width);
  const a = document.createElement("canvas"), g = a.getContext("2d");
  a.width = pw; a.height = ph;
  g.drawImage(picture, pw * PL / (1 + 2 * PL), ph * PT / (1 + 2 * PT), pw / (1 + 2 * PL), ph / (1 + 2 * PT));
  let src = a;
  for (const s of [.09, .3, .05, .2, .08, .4, 1]) {
    const c = document.createElement("canvas");

  const fk = finishAt ? Math.min(1, (now - finishAt) / AUTO_CLEAN_MS) : 0, finish = fk * fk * (3 - 2 * fk);

  // the flakes
  const speed = Math.hypot(bvx, bvy);
  const sx = brush.x - bx0, sy = brush.y - by0, sl2 = sx * sx + sy * sy;
  const R = BRUSH_R * (brush.down ? 1.6 : 1.3) * TOUCH_REACH, R2 = R * R;
  const drag = Math.exp(-dt * 4.4), fadeIn = Math.min(1, t / .8);
  // untouched, the bouquet is never quite still: it sways in slow waves and its flakes quiver; a little calmer once clean
  const flutter = IDLE_MOTION * (1 - .45 * (stage > 1 ? 1 : Math.min(1, Math.max(cleanShare / CLEAN_AT, finish))));
  const bwNow = pictureBox().w, spreadNow = bwNow * (OBJ.spread ?? 1);
  floatNow = reduceMotion ? { x: 0, y: 0, a: 0 } : floatAt(t);
  const pbF = pictureBox(), fcx = pbF.x + pbF.w / 2, fcy = pbF.y + pbF.h / 2, fc = Math.cos(floatNow.a), fs = Math.sin(floatNow.a);
  const growReach = .45 * Math.min(innerWidth, innerHeight);   // within this distance of its place a flake grows to full size
  let grSum = 0;
  for (let i = 0, j = 0, n = N; i < n; i++, j += 4) {
    let x = X[i], y = Y[i], vx = VX[i], vy = VY[i];
    const since = t - WAIT[i], g = since <= 0 ? 0 : since >= 1.6 * GATHER_SLOW ? 1 : since / (1.6 * GATHER_SLOW), ramp = g * g * (3 - 2 * g);
    if (brush.on && live) {
      let u = sl2 > 0 ? ((x - bx0) * sx + (y - by0) * sy) / sl2 : 1;
      u = u < 0 ? 0 : u > 1 ? 1 : u;
      const dx = x - (bx0 + sx * u), dy = y - (by0 + sy * u), d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        // scattered: thrown outward and along the swipe, harder the faster it moves
        const d = Math.sqrt(d2) + .01, w = 1 - d / R;
        const push = w * (w + .35) * (7000 + speed * 16) * dt * SCATTER, carry = w * 9 * dt * SCATTER;
        vx += dx / d * push + (bvx - vx) * carry + (Math.random() - .5) * speed * w * .4 * dt * 60 * SCATTER;
        vy += dy / d * push + (bvy - vy) * carry + (Math.random() - .5) * speed * w * .4 * dt * 60 * SCATTER;
      }
    }
    if (ramp < 1) {                // not yet called in: it drifts on a slow draught
      const k = 26 * dt * (1 - ramp);
      vx += (Math.sin(y * .011 + t * .7) + Math.sin((x + y) * .006 - t * .45)) * k;
      vy += (Math.cos(x * .012 - t * .6) + Math.sin((x - y) * .007 + t * .5)) * k;
    }
    vx *= drag; vy *= drag;
    // drawn back to its place in the bouquet, circling as it comes
    let h0 = HX[i], v0 = HY[i];
    const s = SEED[i] * 40;
    if (finishAt || stage > 1) {   // burnt: drift out to its looser place
      const b = stage > 1 ? 1 : Math.min(1, Math.max(0, (finish * reach - Math.hypot(h0 - originX, v0 - originY) - 60) / 400));
      h0 += SX[i] * spreadNow * b; v0 += SY[i] * spreadNow * b;
    }
    { const dx = h0 - fcx, dy = v0 - fcy; h0 = fcx + dx * fc - dy * fs + floatNow.x; v0 = fcy + dx * fs + dy * fc + floatNow.y; }   // floating
    const hx = h0 + (Math.sin(v0 * .017 + t * 1.1) + Math.sin(v0 * .041 - t * .7 + h0 * .01) * .5 + Math.sin(t * 2.3 + s) * .45) * flutter;
    const hy = v0 + (Math.cos(h0 * .021 - t * .9) * .6 + Math.cos(t * 1.9 + s * 1.7) * .45) * flutter;
    if (Math.random() < .0006 * dt * 60) { vx += (Math.random() - .5) * 90; vy -= 20 + Math.random() * 60; }   // now and then a flake lifts off and drifts back
    const e = (1 - Math.exp(-dt * RATE[i] / (GR[i] < 1 ? GATHER_SLOW : 1))) * ramp, rx = hx - x, ry = hy - y, turn = (1 - ramp) * .9, ct = 1 - turn * turn / 2;
    if (finishAt) {                // as the burning edge passes, the flakes stir and lift, then settle back
      const behind = finish * reach - Math.hypot(x - originX, y - originY);
      const k = Math.max(0, 1 - Math.abs(behind - 80) / 160);
      if (k > 0) { vy -= 200 * k * dt; vx += (Math.random() - .5) * 450 * k * dt; }
    }
    x += vx * dt + (rx * ct - ry * turn) * e;
    y += vy * dt + (rx * turn + ry * ct) * e;
    X[i] = x; Y[i] = y; VX[i] = vx; VY[i] = vy;
    // small while it flies in, growing as it nears its place (once grown it stays full size, even when a swipe throws it about)
    if (GR[i] < 1) {
      const near = 1 - Math.min(1, Math.hypot(hx - x, hy - y) / growReach), soon = Math.min(1, Math.max(0, since / (2.2 * GATHER_SLOW)));   // (and never faster than this, so even the flakes that start close by begin small)
      GR[i] = Math.max(GR[i], Math.min(near * near * (3 - 2 * near), soon), since > 5 * GATHER_SLOW ? 1 : 0);
    }
    grSum += GR[i];
    dyn[j] = x; dyn[j + 1] = y; dyn[j + 2] = fadeIn * OP[i]; dyn[j + 3] = ARRIVE_SMALL + (1 - ARRIVE_SMALL) * GR[i];
  }
  { const m = N ? grSum / N : 1, f = Math.min(1, Math.max(0, (m - .15) / .75)); formed = Math.max(formed, f * f * (3 - 2 * f)); }   // (it never fades back out)

  // draw: the ground first, then the flakes over it
  if (maskDirty) {
    agl.activeTexture(agl.TEXTURE0);
    agl.bindTexture(agl.TEXTURE_2D, maskTex);
    agl.texImage2D(agl.TEXTURE_2D, 0, agl.RGBA, agl.RGBA, agl.UNSIGNED_BYTE, mask);
    maskDirty = false;
  }
  stepWordFx(dt, stage === 1 && finishAt ? finish * reach - 90 : stage > 1 ? 1e9 : -1);
  const box = printBox(pictureBox()), time = now / 1000;
  box.x += floatNow.x; box.y += floatNow.y;   // the glow floats with it
  agl.disable(agl.BLEND);
  agl.useProgram(bgP);
  agl.uniform1i(U.bg.uMask, 0); agl.uniform1i(U.bg.uPrint, 1); agl.uniform1i(U.bg.uWords, 2); agl.uniform1i(U.bg.uGlow, 3); agl.uniform1i(U.bg.uDetail, 4);
  { const pb = pictureBox(); agl.uniform3f(U.bg.uSpin, floatNow.a, pb.x + pb.w / 2 + floatNow.x, pb.y + pb.h / 2 + floatNow.y); }
  agl.uniform2f(U.bg.uRes, innerWidth, innerHeight);
  agl.uniform4f(U.bg.uBox, box.x, box.y, box.w, box.h);
  agl.uniform1f(U.bg.uForm, formed);
  agl.uniform1f(U.bg.uTime, time); agl.uniform1f(U.bg.uFinish, finish); agl.uniform1f(U.bg.uDpr, land.width / innerWidth); agl.uniform2f(U.bg.uOrigin, originX, innerHeight - originY); agl.uniform1f(U.bg.uReach, reach); agl.uniform1f(U.bg.uStage, stage); agl.uniform1f(U.bg.uGreen, greenIn);
  agl.bindBuffer(agl.ARRAY_BUFFER, quadBuf);
  agl.enableVertexAttribArray(0);
  agl.vertexAttribPointer(0, 2, agl.FLOAT, false, 0, 0);
  agl.disableVertexAttribArray(1); agl.disableVertexAttribArray(2);
  agl.drawArrays(agl.TRIANGLE_STRIP, 0, 4);

  agl.enable(agl.BLEND);
  agl.useProgram(ptP);
  agl.uniform1i(U.pt.uMask, 0);
  agl.uniform2f(U.pt.uRes, innerWidth, innerHeight);
  agl.uniform1f(U.pt.uScale, land.width / innerWidth * pictureBox().w / builtW);
  agl.uniform1f(U.pt.uFinish, finish); agl.uniform1f(U.pt.uDpr, land.width / innerWidth); agl.uniform1f(U.pt.uTime, time); agl.uniform2f(U.pt.uOrigin, originX, innerHeight - originY); agl.uniform1f(U.pt.uReach, reach); agl.uniform1f(U.pt.uStage, stage); agl.uniform1f(U.pt.uGreen, greenIn);
  agl.bindBuffer(agl.ARRAY_BUFFER, dynBuf);
  agl.bufferSubData(agl.ARRAY_BUFFER, 0, dyn);
  agl.vertexAttribPointer(0, 4, agl.FLOAT, false, 0, 0);
  agl.bindBuffer(agl.ARRAY_BUFFER, statBuf);
  agl.enableVertexAttribArray(1);
  agl.vertexAttribPointer(1, 3, agl.FLOAT, false, 0, 0);
  agl.bindBuffer(agl.ARRAY_BUFFER, colBuf);
  agl.enableVertexAttribArray(2);
  agl.vertexAttribPointer(2, 3, agl.FLOAT, false, 0, 0);
  agl.drawArrays(agl.POINTS, 0, N);
}

/* ───────────── the words left in ash ───────────── */
const wordCv = document.createElement("canvas");
let placed = [];     // each word and where it sits: { text, fx, fy, fw } as shares of the screen (fw: its width)
function placeWords(list) {
  placed = [];
  const fs = wordSize(), b = pictureBox(), pad = 30, m = Math.max(16, fs * .8);
  const low = OBJ.notes ? Math.max(m, innerHeight * .09 + 56) : m;   // with "Tap to read" at the bottom, the words keep above it
  const order = list.slice().sort(() => Math.random() - .5);       // which word goes where changes each visit
  const widest = Math.max(...order.map(t => measureWord(t, fs)));
  // the two sides of the bouquet; on a narrow screen (a phone held upright) there is no room beside it, so use above and below
  const sideBySide = b.x - pad - m >= widest && innerWidth - (b.x + b.w + pad) - m >= widest;
  const halves = sideBySide
    ? [{ x0: m, x1: b.x - pad, y0: m + fs, y1: innerHeight - low }, { x0: b.x + b.w + pad, x1: innerWidth - m, y0: m + fs, y1: innerHeight - low }]
    : [{ x0: m, x1: innerWidth - m, y0: m + fs, y1: Math.max(m + fs, b.y - pad) }, { x0: m, x1: innerWidth - m, y0: Math.min(innerHeight - low, b.y + b.h + pad + fs), y1: innerHeight - low }];
  const first = Math.random() < .5 ? 0 : 1;
  const groups = [[], []];
  order.forEach((t, k) => groups[(first + k) % 2].push(t));        // alternate sides, so they split as evenly as they can
  groups.forEach((g, side) => {
    const h = halves[side];
    g.forEach((text, k) => {
      const tw = measureWord(text, fs);
      // spread evenly down the side (or across, above and below), each in its own slot, nudged a little at random
      let x, y;
      if (sideBySide) {
        const slot = (h.y1 - h.y0) / g.length;
        y = h.y0 + slot * (k + .5 + (Math.random() - .5) * .45);
        x = h.x0 + Math.random() * Math.max(0, h.x1 - h.x0 - tw);
      } else {
        const slot = (h.x1 - h.x0) / g.length;
        x = h.x0 + slot * (k + .5) - tw / 2 + (Math.random() - .5) * Math.max(0, slot - tw) * .8;
        x = Math.max(h.x0, Math.min(h.x1 - tw, x));
        y = h.y0 + Math.random() * Math.max(0, h.y1 - h.y0);
      }
      placed.push({ text, fx: x / innerWidth, fy: y / innerHeight });
    });
  });
  drawWords();
}
// the ash words are painted onto a canvas, which does not wait for the font: load Krub first, and repaint them if it arrives late
if (document.fonts) document.fonts.load(`400 20px ${WORD_FONT}`).then(() => { if (agl && placed.length) drawWords(); }).catch(() => {});
function wordSize() { return Math.max(WORD_SIZE[0], Math.min(WORD_SIZE[2], Math.min(innerWidth, innerHeight) * WORD_SIZE[1] / 100)); }
function measureWord(text, fs) {
  const c = wordCv.getContext("2d"); c.font = `400 ${fs}px ${WORD_FONT}`;
  return c.measureText(text).width + fs * .14 * (text.length - 1);
}
function drawWords() {
  if (!agl || !placed.length) return;
  wordCv.width = Math.ceil(innerWidth); wordCv.height = Math.ceil(innerHeight);
  const c = wordCv.getContext("2d"), fs = wordSize();
  c.fillStyle = "#000"; c.fillRect(0, 0, wordCv.width, wordCv.height);
  c.font = `400 ${fs}px ${WORD_FONT}`;
  // green: which word owns this patch of screen (so each can float on its own); red: the letters
  c.globalCompositeOperation = "lighter";
  const pad = FLOAT + 16;
  placed.forEach((w, n) => {
    c.fillStyle = `rgb(0,${(n + 1) * 40},0)`;
    c.fillRect(w.fx * innerWidth - pad, w.fy * innerHeight - fs * 1.1 - pad, measureWord(w.text, fs) + pad * 2, fs * 1.5 + pad * 2);
  });
  c.fillStyle = "#f00";
  for (const w of placed) {
    let x = w.fx * innerWidth;
    for (const ch of w.text) { c.fillText(ch, x, w.fy * innerHeight); x += c.measureText(ch).width + fs * .14; }
  }
  c.globalCompositeOperation = "source-over";
  agl.activeTexture(agl.TEXTURE2);
  agl.bindTexture(agl.TEXTURE_2D, wordsTex);
  agl.texImage2D(agl.TEXTURE_2D, 0, agl.RGBA, agl.RGBA, agl.UNSIGNED_BYTE, wordCv);
}

/* ───────────── the word gathering: ash and embers drawn into the letters as the burn reaches them ───────────── */
const fxCv = document.getElementById("wordfx"), fx = fxCv.getContext("2d");
let fxParts = [], fxSeeded = false, fxDone = false;
function sizeWordFx() {
  fxCv.width = Math.round(innerWidth * dpr); fxCv.height = Math.round(innerHeight * dpr);
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
// pick points inside the letters, and give each a flake that will fly in to it
function seedWordFx() {
  const fs = wordSize(), pts = [];
  for (const wd of placed) {
    const x0 = Math.max(0, Math.floor(wd.fx * innerWidth - fs * .3)), y0 = Math.max(0, Math.floor(wd.fy * innerHeight - fs * 1.1));
    const w = Math.min(wordCv.width - x0, Math.ceil(measureWord(wd.text, fs) + fs * .6)), h = Math.min(wordCv.height - y0, Math.ceil(fs * 1.6));
    if (w <= 0 || h <= 0) continue;
    const d = wordCv.getContext("2d").getImageData(x0, y0, w, h).data;
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (d[(y * w + x) * 4] > 140) pts.push([x0 + x, y0 + y]);
  }
  const n = Math.min(WORD_FX, pts.length);
  fxParts = [];
  for (let i = 0; i < n; i++) {
    const [tx, ty] = pts[Math.random() * pts.length | 0];
    const a = Math.random() * 6.283, dist = 30 + Math.random() * 100;
    fxParts.push({ tx, ty, sx: tx + Math.cos(a) * dist, sy: ty + Math.sin(a) * dist * .7 - 20, bend: (Math.random() - .5) * 90,
      reach: Math.hypot(tx - originX, ty - originY) + (Math.random() - .5) * 60, t: -1, dur: .8 + Math.random() * .9,
      size: .7 + Math.random() * 1.9, hot: Math.random(), spark: Math.random() < .07 * FIRE });
  }
}
function stepWordFx(dt, front) {
  if (front < 0 || !placed.length || fxDone) return;
  if (!fxSeeded) { fxSeeded = true; seedWordFx(); }
  if (!fxParts.length) { fxDone = true; return; }
  fx.clearRect(0, 0, innerWidth, innerHeight);
  let alive = 0;
  for (const p of fxParts) {
    if (p.t < 0) { if (front >= p.reach) p.t = 0; else { alive++; continue; } }
    p.t += dt / p.dur;
    const life = p.t;
    if (life > 2.2) continue;
    alive++;
    if (life <= 1) {
      // flying in on a curve, hot at first, cooling to ash as it lands
      const e = 1 - Math.pow(1 - life, 3), nx = -(p.ty - p.sy), ny = p.tx - p.sx, nl = Math.hypot(nx, ny) || 1;
      const bow = Math.sin(life * Math.PI) * p.bend;
      const x = p.sx + (p.tx - p.sx) * e + nx / nl * bow, y = p.sy + (p.ty - p.sy) * e + ny / nl * bow;
      const heat = Math.max(0, 1 - life * 1.6) * (.35 + .65 * p.hot) * FIRE;
      // ember orange cooling to dark ash
      const r = Math.round(42 + 213 * heat), g = Math.round(40 + (70 + 90 * heat) * heat), b = Math.round(38 - 20 * heat);
      const fade = Math.min(1, life * 6);
      if (heat > .25) {
        fx.globalCompositeOperation = "lighter";
        fx.fillStyle = `rgba(255,90,20,${heat * .1 * fade})`;
        fx.beginPath(); fx.arc(x, y, p.size * 2.6, 0, 6.283); fx.fill();
        fx.globalCompositeOperation = "source-over";
      }
      fx.fillStyle = `rgba(${r},${g},${b},${(.7 + .3 * heat) * fade})`;
      fx.beginPath(); fx.arc(x, y, p.size * (.8 + heat * .4), 0, 6.283); fx.fill();
    } else if (p.spark) {
      // a few let go again as tiny embers rising off the letters
      const k = (life - 1) / 1.2, x = p.tx + Math.sin(k * 9 + p.hot * 6) * 6, y = p.ty - k * 46;
      fx.fillStyle = `rgba(255,${110 + Math.round(90 * (1 - k))},30,${(1 - k) * .9})`;
      fx.beginPath(); fx.arc(x, y, p.size * .7 * (1 - k * .5), 0, 6.283); fx.fill();
    } else {
      // landed: it settles into the ash of the letter and fades
      const k = (life - 1) / 1.2;
      fx.fillStyle = `rgba(40,38,36,${(1 - k) * .6})`;
      fx.beginPath(); fx.arc(p.tx, p.ty, p.size, 0, 6.283); fx.fill();
    }
  }
  if (!alive) { fx.clearRect(0, 0, innerWidth, innerHeight); fxDone = true; fxParts = []; }
}

/* ───────────── words that open a paragraph (an object's notes) ───────────── */
const noteEl = document.getElementById("note");
let wordBtns = [], noteOpen = false, noteFrom = null, noteSeen = false;   // noteSeen: a word has been opened (the "Tap to read" line then fades)
const readHint = document.getElementById("readhint");
function openNote(word) {
  noteEl.querySelector(".from").textContent = OBJ.title || "";
  noteEl.querySelector("h2").textContent = word;
  noteEl.querySelector(".text").textContent = OBJ.notes[word];
  noteFrom = document.activeElement;
  noteEl.classList.add("open"); noteOpen = true; noteSeen = true; brush.on = brush.down = false;
  noteEl.querySelector(".card").focus({ preventScroll: true });   // (the card, so no focus ring flashes on the Close button)
}
function closeNote() {
  if (!noteOpen) return;
  noteEl.classList.remove("open"); noteOpen = false; brush.on = brush.down = false;
  if (noteFrom && noteFrom.focus) noteFrom.focus({ preventScroll: true });
}
noteEl.addEventListener("click", e => { if (e.target === noteEl || e.target.closest(".close")) closeNote(); });   // the close button, or a tap outside the card
addEventListener("keydown", e => { if (e.key === "Escape") closeNote(); });
// each frame: keep one button over each word, floating with it, pressable only while the words lie on the grey layer
function stepWordButtons(now) {
  if (!OBJ.notes || !placed.length) return;
  if (!wordBtns.length) wordBtns = placed.map(w => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "wordbtn"; b.tabIndex = -1; b.setAttribute("aria-label", w.text);
    b.addEventListener("click", () => openNote(w.text));
    document.body.appendChild(b); return b;
  });
  const on = stage === 2 && !finishAt && !!OBJ.notes;
  readHint.classList.toggle("gone", !on || noteSeen);   // "Tap to read" while the words can be opened, until one has been
  const fs = wordSize(), t = now / 1000, ww = 6.2832 / FLOAT_TIME;
  placed.forEach((w, n) => {
    const b = wordBtns[n], id = n + 1;
    if (!b) return;
    if (b.classList.contains("show") !== on) { b.classList.toggle("show", on); b.tabIndex = on ? 0 : -1; }
    if (!on) return;
    // the same drift the shader gives each word (its y runs upward, the page's runs down)
    const dx = FLOAT * .5 * Math.sin(t * ww * .7 + id * 2.1) + FLOAT * .15 * Math.sin(t * ww * 1.6 + id);
    const dy = -FLOAT * .7 * Math.sin(t * ww * (.9 + .08 * id) + id * 1.7);
    const bw = measureWord(w.text, fs), bh = fs * 1.5, extra = Math.max(0, 44 - bh) / 2;   // at least a 44px thumb target
    b.style.width = bw + "px"; b.style.height = bh + extra * 2 + "px";
    b.style.transform = `translate(${w.fx * innerWidth + dx}px, ${w.fy * innerHeight - fs * 1.08 - extra + dy}px)`;
  });
}

/* ───────────── sequence ───────────── */
function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  sizeLanding();
  sizeWordFx();
  if (agl && picture) { if (placed.length) drawWords(); else { wordCv.width = wordCv.height = 1; agl.activeTexture(agl.TEXTURE2); agl.bindTexture(agl.TEXTURE_2D, wordsTex); agl.texImage2D(agl.TEXTURE_2D, 0, agl.RGBA, agl.RGBA, agl.UNSIGNED_BYTE, wordCv); } }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  stepLanding(dt, now);
  stepWordButtons(now);
  requestAnimationFrame(frame);
}

async function begin() {
  if (agl) picture = await loadPicture();
  if (!picture) { agl = null; land.style.display = "none"; }
  layout();
  requestAnimationFrame(frame);
}

let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 120); });
begin();
</script>
